# =============================================================================
# Dev Profile — Local Development
# =============================================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# =============================================================================
# Cloudinary Configuration
#
# To configure Cloudinary, set the following environment variables:
#   CLOUDINARY_CLOUD_NAME  — your Cloudinary cloud name (from dashboard)
#   CLOUDINARY_API_KEY     — your Cloudinary API key (from dashboard)
#   CLOUDINARY_API_SECRET  — your Cloudinary API secret (from dashboard)
#
# For local dev, you can also replace the default values below directly
# (NOT recommended for production — use env vars or a .env file instead).
# =============================================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}


# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate — auto-create schema for dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Relaxed JWT for dev — 1 hour expiry
application.security.jwt.expiration=3600000
