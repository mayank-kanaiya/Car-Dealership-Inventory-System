# =============================================================================
# Car Dealership Inventory System — Shared Defaults
# =============================================================================

spring.application.name=car-dealership-inventory-system
spring.profiles.active=dev

# =============================================================================
# Server Configuration
# =============================================================================

server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=30000
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# =============================================================================
# Error Handling — Never leak internals to clients
# =============================================================================

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# =============================================================================
# JWT Configuration
# =============================================================================

application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# =============================================================================
# Cloudinary Configuration
#
# To configure Cloudinary, set the following environment variables:
#   CLOUDINARY_CLOUD_NAME  — your Cloudinary cloud name (from dashboard)
#   CLOUDINARY_API_KEY     — your Cloudinary API key (from dashboard)
#   CLOUDINARY_API_SECRET  — your Cloudinary API secret (from dashboard)
#
# For local dev, you can also replace the default values below directly
# (NOT recommended for production — use env vars or a .env file instead).
# =============================================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:abc}
cloudinary.api-key=${CLOUDINARY_API_KEY:123}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:2njg1Gh4}


# Upload folder inside Cloudinary (all vehicle images go here)
cloudinary.folder=car-dealership/vehicles

# Allowed image MIME types (comma-separated)
cloudinary.allowed-formats=image/jpeg,image/png,image/webp,image/gif

# Max upload file size in bytes (5 MB = 5 * 1024 * 1024)
cloudinary.max-file-size=5242880

# =============================================================================
# Vehicle Defaults
# =============================================================================

vehicle.default-image=/images/default-vehicle.svg

# =============================================================================
# Actuator — Health Check & Metrics
# =============================================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# =============================================================================
# App Metadata
# =============================================================================

info.app.name=Vehicle Inventory API
info.app.version=1.0.0
info.app.description=Production-grade vehicle inventory management system
