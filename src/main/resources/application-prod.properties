# =============================================================================
# Production Profile — MySQL, Tuned for 500 Concurrent Users
# =============================================================================

# =============================================================================
# MySQL Datasource — HikariCP Connection Pool
#
# Tuning rationale for 500 concurrent users:
#   - pool size = (2 * CPU cores) + effective_spindle_count
#   - Assuming 8-core server with SSDs: (2*8) + 1 = 17
#   - Rounded up to 30 for burst capacity
#   - minimum-idle=10 keeps warm connections ready
#   - max-lifetime=1800000 (30 min) forces periodic reconnection
#     to handle stale MySQL connections and network partitions
# =============================================================================

spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/car_dealership_inventory_db?useSSL=true&requireSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=CarDealershipInventoryPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================================
# JPA / Hibernate — Production Tuning
#
# - ddl-auto=none: NEVER auto-create schema in production
# - Batch inserts/updates: reduces round-trips to MySQL
# - Second-level cache: disabled (add Redis/EhCache if needed)
# - Stateless persistence context: better memory usage
# =============================================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate Batch Operations (critical for 500-user write throughput)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Hibernate MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Release — avoid dangling connections
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Statistics OFF in prod (enable per-need for debugging)
spring.jpa.properties.hibernate.generate_statistics=false

# =============================================================================
# Tomcat — Tuned for 500 Concurrent Users
#
# - max-threads=200: handles ~200 simultaneous request executions
#   (remaining 300 users will queue via accept-count)
# - accept-count=100: TCP queue when all threads busy
#   (handles brief traffic spikes without rejecting)
# - max-connections=10000: matches expected concurrent TCP connections
# =============================================================================

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-keep-alive-requests=100

# =============================================================================
# JWT — Strict for Production
#
# - 15 minute access token (short-lived = less damage if stolen)
# - Secret MUST come from environment variable
# =============================================================================

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=900000
